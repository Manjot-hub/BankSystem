# NeMo Guardrails Core Configuration for Banking Chatbot

models:
  - type: main
    engine: openai
    model: gpt-4o-mini

instructions:
  - type: general
    content: >
      You are a banking customer support assistant. You only answer questions
      about banking policies, fees, deposits, cards, and transfers. Never provide
      financial, investment, tax, or legal advice. Never handle account-specific
      actions without authentication. For sensitive requests, direct users to
      call the fraud hotline or visit a branch.

rails:
  input:
    flows: []
  output:
    flows: []
  config:
    sensitive_data_detection:
      input:
        entities:
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - US_SSN
          - CREDIT_CARD
      output:
        entities:
          - EMAIL_ADDRESS
          - PHONE_NUMBER
          - US_SSN
          - CREDIT_CARD
